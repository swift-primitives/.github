# swift-primitives org-level metadata.
#
# Schema mirrors per-repo .github/metadata.yaml. Per-repo files may declare
# any subset of these keys; missing keys inherit the org default declared here.
#
# Read by sync-metadata.yml (existing) for description/topics/homepage and by
# generate-social-preview.yml for socialPreview brand defaults.

description: "Atomic building blocks for Swift."
homepage: "https://swift-institute.org"

socialPreview:
  accent:
    from: "#D88751"   # bronze gradient top
    to: "#A04A1B"     # bronze gradient bottom
    text: "#A04A1B"   # caption ink
  caption: "PRIMITIVES"
readme:
  family: G

# Org-account profile fields (display name, description, email, website, X, location).
# Applied via `gh api -X PATCH /orgs/<org>`; no org-level sync workflow exists yet.
org:
  name: "Swift Primitives"
  description: "Atomic building blocks for Swift — Layer 1 of the Swift Institute ecosystem."
  email: "coen@coenttb.com"
  blog: "https://swift-institute.org"
  twitter: "coenttb"
  location: "Netherlands"
