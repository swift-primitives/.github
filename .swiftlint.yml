# Tier 2 — swift-primitives org-specific SwiftLint configuration.
#
# Inherits from the swift-institute Tier 1 ecosystem-wide canonical:
#
#   parent_config: https://raw.githubusercontent.com/swift-institute/.github/main/.swiftlint.yml
#
# Per-sub-package .swiftlint.yml files in swift-primitives/swift-*-primitives/
# inherit from THIS file via:
#
#   parent_config: https://raw.githubusercontent.com/swift-primitives/.github/main/.swiftlint.yml
#
# Phase 1 changes (2026-05-05) — see swift-institute/Research/
# rollout-phase-1-results.md for the rationale:
#   - Custom Foundation-import rule pair replaces the γ-1a workflow per
#     research §3.4.2 ([PRIM-FOUND-001]). Foundation ban is primitives-specific
#     (only L1 forbids Foundation imports across the ecosystem); the rules live
#     here at Tier 2 rather than Tier 1 so other ecosystems do NOT inherit them.

parent_config: https://raw.githubusercontent.com/swift-institute/.github/main/.swiftlint.yml

# ── Custom rules ─────────────────────────────────────────────────────────────
#
# Per Phase 1 (2026-05-05): the no_foundation_import_* rules replace the
# γ-1a `lint-foundation-family-import.yml` per-PR workflow + the
# `lint-foundation-family-import-weekly.yml` cron orchestrator + the
# audit-foundation-import.py script. Both rules use the same regex pattern
# as the audit script (research §3.4.2), which catches all attribute and
# access-modifier permutations:
#
#   import Foundation
#   public import Foundation
#   package import Foundation
#   internal import Foundation
#   fileprivate import Foundation
#   private import Foundation
#   @_exported import Foundation
#   @_exported public import Foundation
#   @_implementationOnly import Foundation
#   @preconcurrency import Foundation
#   @preconcurrency public import Foundation
#   ...and combinations of the above.
#
# The path-based ERROR/WARNING split (Sources/** + Tests/Support/** = ERROR,
# Tests/** elsewhere = WARNING) per research §3.4.2 is implemented as two
# rules with disjoint `included:` filters. Both reject Foundation,
# FoundationEssentials, FoundationInternationalization (with `\b` boundary
# rejecting FoundationFooBar etc.).
custom_rules:
  no_foundation_import_error:
    name: "No Foundation Family Import (gating)"
    regex: '^[ \t]*(?:@[a-zA-Z_]+[ \t]+)*(?:public|package|internal|fileprivate|private)?[ \t]*import[ \t]+(Foundation|FoundationEssentials|FoundationInternationalization)\b'
    message: "Foundation-family imports are forbidden in Sources/** and Tests/Support/** ([PRIM-FOUND-001], research §3.4.2)."
    severity: error
    included:
      - 'Sources/.*\.swift'
      - 'Tests/Support/.*\.swift'
  no_foundation_import_warning:
    name: "No Foundation Family Import (advisory)"
    regex: '^[ \t]*(?:@[a-zA-Z_]+[ \t]+)*(?:public|package|internal|fileprivate|private)?[ \t]*import[ \t]+(Foundation|FoundationEssentials|FoundationInternationalization)\b'
    message: "Foundation-family imports in Tests/** outside Tests/Support/ are flagged as warnings ([PRIM-FOUND-001], research §3.4.2)."
    severity: warning
    included:
      - 'Tests/.*\.swift'
    excluded:
      - 'Tests/Support/.*\.swift'
  l1_no_platform_conditionals:
    name: "L1 Primitives Are Platform-Agnostic ([PLAT-ARCH-008c])"
    regex: '^[ \t]*#(?:if|elseif)\s+(?:!\s*)?(?:os|canImport)\s*\('
    message: "L1 primitives MUST NOT contain '#if os(...)' or '#if canImport(...)' guards — they must be unconditionally platform-agnostic ([PLAT-ARCH-008c]). Platform-specific code belongs at L2/L3."
    severity: error
    included:
      - 'Sources/.*\.swift'
  # Cardinal / Ordinal / Vector enforcement cohort (2026-05-06) — see
  # swift-institute/Research/cardinal-ordinal-vector-enforcement-design.md
  # v1.0.0 for the rationale and empirical baseline. Each rule flags a
  # specific drift away from the canonical preference hierarchy
  # ([CONV-016]) and the high-typed Cardinal/Ordinal/Affine.Discrete
  # discipline ([INFRA-101], [INFRA-102], [INFRA-103], [INFRA-200]).
  # Severity warning (gated to error in CI via --strict). Empirical
  # baseline at landing: ~80-130 violations expected, concentrated in
  # swift-buffer-primitives, swift-tree-primitives, swift-ordinal-primitives,
  # swift-hash-table-primitives.
  cardinal_count_minus_one_anti_pattern:
    name: "Cardinal count - 1 Anti-Pattern ([INFRA-025])"
    regex: '\bcount\s*-\s*1\b'
    message: "`count - 1` indicates `count: Int` not `count: Cardinal` (the typed form would not compile per [INFRA-200]). Use `.subtract.saturating(.one)` or the appropriate typed-arithmetic form per [INFRA-025]."
    severity: warning
  cardinal_zero_one_constructor_anti_pattern:
    name: "Cardinal(0) / Cardinal(1) Anti-Pattern ([INFRA-101])"
    regex: '\bCardinal\(\s*[01]\s*\)'
    message: "`Cardinal(0)` / `Cardinal(1)` should use the canonical accessors `.zero` / `.one` per [INFRA-101]."
    severity: warning
  chained_rawvalue_access_anti_pattern:
    name: "Chained .rawValue Access Anti-Pattern ([INFRA-103])"
    regex: '\.rawValue\.\w+'
    message: "Chaining a member access through `.rawValue` escapes the typed system. Prefer `.retag()` (Tier 1) / `.map()` (Tier 2) / `Type.min(a, b)` per the canonical preference hierarchy [CONV-016]; see [INFRA-103]."
    severity: warning
  bitpattern_rawvalue_chain_anti_pattern:
    name: "Int(bitPattern: ....rawValue) Chain Anti-Pattern ([INFRA-002])"
    regex: 'Int\(bitPattern:\s*[^)]*\.rawValue'
    message: "`Int(bitPattern: foo.rawValue)` chains through .rawValue and bypasses the canonical preference hierarchy. Prefer `.retag()` / `.map()` (Tier 1/2 of [CONV-016]) before resorting to the [INFRA-002] integration overload — and when you do use the overload, pass the typed value directly: `Int(bitPattern: foo)` not `Int(bitPattern: foo.rawValue)`."
    severity: warning
