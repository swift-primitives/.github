name: Swift CI (primitives layer)

# Layer wrapper for swift-institute/.github/.github/workflows/swift-ci.yml.
#
# Encodes the L1 layer invariants that swift-institute's universal reusable
# does not (and should not) carry. Currently:
#   - Embedded build verification: every primitives package MUST be
#     buildable under `-enable-experimental-feature Embedded` against the
#     Swift 6.4-dev nightly Linux container. This is the CI manifestation
#     of [PRIM-FOUND-001] (Foundation-free) extended into freestanding-
#     buildability per swift-package-build [PKG-BUILD-007]/[PKG-BUILD-008].
#     A package that cannot satisfy this invariant is, by that fact, not
#     a primitive — it belongs at L2 or L3.
#
# The embedded job runs with continue-on-error: true (matches linux-nightly
# precedent; the embedded job uses the nightly container and inherits its
# instability profile during the 6.4-dev development window).
#
# Consume from a caller package's .github/workflows/ci.yml via:
#
#   jobs:
#     ci:
#       uses: swift-primitives/.github/.github/workflows/swift-ci.yml@main
#       with:
#         enable-private-repos: true       # only if package depends on private repos
#       secrets:
#         PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
#
# `enable-embedded-check` is intentionally NOT exposed as an input — embedded
# buildability is a layer invariant for L1 primitives, not a per-package opt-in.

on:
  workflow_call:
    inputs:
      cache-key-prefix:
        type: string
        default: "swift63-spm-v1"
        description: "Cache-key prefix, typically '{swift-version tag}-spm-v{cache bump}'. Used only by the embedded job (sole permitted .build cache per [CI-040])."
      swift-version:
        type: string
        default: "6.3"
        description: "Swift stable floor used for the SDK-install jobs (Wasm, Android, Static-musl) and propagated to the universal matrix. Mirrors the universal reusable's input so callers bumping the floor flip both layer and universal in one input."
      enable-private-repos:
        type: boolean
        default: true
        description: "If true, configure git to use PRIVATE_REPO_TOKEN for github.com clones. Default true: most L1 consumers depend on private deps."
      macos-runner:
        type: string
        default: "macos-26"
        description: "macOS runner image. Bump annually when GitHub adds a new image version. env.* is invalid in runs-on: per Actions context-availability rules — input is the working centralization mechanism."
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false

# Workflow-level env vars centralize tool versions so each release bump
# is a single edit instead of N grep-and-replace sites. Per
# feedback_latest_versions_only.md these MUST track the latest stable
# release of each tool; bump on every workflow touch where a newer
# release exists.
env:
  XCODE_VERSION: "26.4"

jobs:
  # L1 invariant: Foundation-free per [PRIM-FOUND-001] +
  # freestanding-buildable per [PKG-BUILD-007]/[PKG-BUILD-008].
  # Declared first so it appears alongside the universal-matrix builds
  # in the consumer's CI sidebar (rather than orphaned at the bottom).
  embedded:
    name: Ubuntu (Swift 6.4-dev nightly, Embedded build)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-main-jammy
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: swift-institute/.github/.github/actions/configure-private-repos@main
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: linux-embedded-${{ inputs.cache-key-prefix }}-${{ hashFiles('Package.swift', 'Package@*.swift') }}

      - name: Build (Embedded)
        run: swift build -Xswiftc -enable-experimental-feature -Xswiftc Embedded

  # γ-3 advisory — Embedded Wasm SDK build verification on stable Swift 6.3
  # (per swiftlang/swift-syntax precedent: stable, not nightly). 4-week
  # classified soak per research §3.4.6 with five-class failure tracking
  # (package-actionable / toolchain / SDK install / workflow / known-unsupported).
  # Flip on "no package-actionable failures + no toolchain instability for 2
  # consecutive weekly sweeps."
  embedded-wasm-sdk:
    name: Ubuntu (Swift 6.3, Embedded Wasm SDK build)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    continue-on-error: true     # γ-3 advisory; classified soak. Drop after flip.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: swift-institute/.github/.github/actions/configure-private-repos@main
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      # Dynamic resolution per Research/wasm-ci-strategy-and-sdk-toolchain-coupling.md
      # v1.0.0 §Q4 Option α — eliminates soak-taxonomy class C.2 by construction.
      # The composite action handles container-Swift detection, releases.json
      # lookup, URL construction, swift sdk install, and GITHUB_ENV write.
      - name: Install Embedded Wasm SDK matching container Swift
        uses: swift-institute/.github/.github/actions/install-swift-sdk@main
        with:
          platform: wasm-sdk
          bundle-suffix: wasm
          sdk-id: ${TAG}_wasm-embedded
          output-env-var: WASM_SDK_ID

      - name: Build (Embedded Wasm)
        run: swift build --swift-sdk "${WASM_SDK_ID}"

  # Advisory — Android cross-compile build verification on stable Swift 6.3
  # via the official swift.org Android SDK. Same dynamic-resolution pattern
  # as embedded-wasm-sdk: the SDK is paired to the container's Swift
  # toolchain at run-time. Targets aarch64-android by default (the SDK
  # bundle's single variant). Same 4-week classified soak as γ-3 with
  # five-class failure tracking. Flip to gating on "no package-actionable
  # failures for 2 consecutive weekly sweeps."
  android-build:
    name: Ubuntu (Swift 6.3, Android SDK build)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    continue-on-error: true     # advisory; classified soak. Drop after flip.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: swift-institute/.github/.github/actions/configure-private-repos@main
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      # Bundle exposes one swiftSDK variant: ${TAG}_android (verified via
      # info.json inspection of the 6.3.1 bundle). Same ABI-pairing
      # constraint as the Wasm SDK.
      - name: Install Android SDK matching container Swift
        uses: swift-institute/.github/.github/actions/install-swift-sdk@main
        with:
          platform: android-sdk
          bundle-suffix: android
          sdk-id: ${TAG}_android
          output-env-var: ANDROID_SDK_ID

      - name: Build (Android)
        run: swift build --swift-sdk "${ANDROID_SDK_ID}"

  # γ-3b advisory — Static Linux musl build verification on stable Swift 6.3
  # via the official swift.org Static Linux SDK. Tests a different invariant
  # than embedded: "no glibc dynamic linkage" — the resulting binary links
  # only musl statically and runs on any Linux distribution. Per research
  # §3.4.6 may stay advisory permanently (different value-class than the
  # gate-on-flip Wasm/Android jobs).
  # Bundle URL convention includes the SDK version (currently 0.1.0)
  # exposed in releases.json as the static-sdk platform's `version` field.
  static-linux-musl-build:
    name: Ubuntu (Swift 6.3, Static Linux musl build)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    continue-on-error: true     # γ-3b advisory; may remain permanently.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: swift-institute/.github/.github/actions/configure-private-repos@main
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      # Bundle URL pattern includes the SDK's own version (the platform
      # entry's `version` field in releases.json — currently 0.1.0).
      # SDK ID is triple-based (x86_64-swift-linux-musl); composite's
      # ${TAG}-substitution leaves it unchanged. The Build step below
      # uses the literal triple directly, so output-env-var is omitted.
      - name: Install Static Linux SDK matching container Swift
        uses: swift-institute/.github/.github/actions/install-swift-sdk@main
        with:
          platform: static-sdk
          bundle-suffix: static-linux
          use-platform-version: 'true'
          sdk-id: x86_64-swift-linux-musl

      - name: Build (Static Linux musl, x86_64)
        run: swift build --swift-sdk x86_64-swift-linux-musl

  # Apple-platform cross-compile (advisory) — verifies L1 packages
  # compile cleanly for the iOS/tvOS/watchOS/visionOS Simulators declared
  # in Package.swift's `platforms:` list. Mirrors swiftpackageindex.com's
  # compatibility-badge surface so SPI's release-time builds align with
  # our PR-time feedback. Build-only via `xcodebuild build` (no test
  # execution; iOS-family Simulator tests would require boot + would not
  # add signal beyond compile correctness for L1 primitives' pure-compute
  # surface). Same 4-week classified soak as γ-3 with five-class failure
  # tracking (package-actionable / toolchain / SDK install / workflow /
  # known-unsupported). Flip to gating after 2 consecutive clean weekly
  # sweeps with no package-actionable failures.
  apple-simulator-build:
    name: macOS (Swift 6.3, debug, ${{ matrix.platform }} Simulator build)
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ inputs.macos-runner }}
    continue-on-error: true     # advisory; classified soak. Drop after flip.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@v6

      - uses: swift-institute/.github/.github/actions/configure-private-repos@main
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print Swift version
        run: swift --version

      - name: Discover SwiftPM-generated scheme
        shell: bash
        run: |
          set -euo pipefail
          # SwiftPM auto-generates schemes from Package.swift. Probe via
          # `xcodebuild -list -json`; fall back to the package name from
          # `swift package describe`.
          SCHEME=$(xcodebuild -list -json 2>/dev/null | jq -r '.project.schemes[0] // .workspace.schemes[0] // ""')
          if [[ -z "$SCHEME" ]]; then
            SCHEME=$(swift package describe --type json | jq -r '.name')
          fi
          if [[ -z "$SCHEME" ]]; then
            echo "Could not determine scheme name" >&2
            exit 1
          fi
          echo "Discovered scheme: ${SCHEME}"
          echo "SCHEME=${SCHEME}" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.platform }} Simulator)
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme "${SCHEME}" \
            -destination "generic/platform=${{ matrix.platform }} Simulator" \
            -quiet

  # Universal matrix delegated to the ecosystem-wide reusable. Declared
  # after `embedded` so the layer-specific build groups visually with
  # the matrix builds (macOS/Ubuntu/Windows) in the consumer's CI sidebar.
  matrix:
    if: ${{ !github.event.repository.private }}
    uses: swift-institute/.github/.github/workflows/swift-ci.yml@main
    with:
      swift-version: ${{ inputs.swift-version }}
      enable-private-repos: ${{ inputs.enable-private-repos }}
      macos-runner: ${{ inputs.macos-runner }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
