# generate-social-preview.yml — swift-primitives org wrapper.
#
# Reads org-level metadata.yaml (this repo) for brand defaults, then calls
# the universal reusable at swift-institute/.github/.github/workflows/generate-social-preview.yml
# for each public repo in the swift-primitives org.
#
# Single-file design: brand inputs live alongside description/topics/homepage
# under the same metadata.yaml schema. Per-repo socialPreview overrides are
# resolved inside the universal reusable when the target metadata.yaml
# declares them.
#
# Public-repo gate per [CI-032] / feedback_private_repos_no_ci_runs.md:
# enumeration filters isPrivate == false; jobs gate on
# !github.event.repository.private; reusable double-checks target privacy.

name: generate-social-preview

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to (re)generate, e.g. swift-carrier-primitives. Empty = all public swift-primitives repos.'
        type: string
        required: false
      dry-run:
        description: 'Render and upload as artifact, do not open PR.'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '30 4 * * *'  # 04:30 UTC daily
  push:
    branches: [main]
    paths:
      - 'metadata.yaml'

jobs:
  enumerate:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.repo }}" ]; then
            echo "repos=[\"${{ inputs.repo }}\"]" >> "$GITHUB_OUTPUT"
          else
            # Filter to:
            #   - public only (Free-plan CI policy per [CI-032])
            #   - Swift-package repos only (skip .github, *.org infrastructure)
            repos=$(gh repo list swift-primitives --limit 200 --json name,isPrivate \
              --jq '[
                .[]
                | select(.isPrivate == false)
                | select(.name | startswith("swift-"))
                | select(.name | endswith(".org") | not)
                | .name
              ]')
            echo "repos=$repos" >> "$GITHUB_OUTPUT"
          fi

  resolve-brand:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      accent-from: ${{ steps.read.outputs.accent-from }}
      accent-to: ${{ steps.read.outputs.accent-to }}
      accent-text: ${{ steps.read.outputs.accent-text }}
      caption: ${{ steps.read.outputs.caption }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "accent-from=$(yq '.socialPreview.accent.from' metadata.yaml)" >> "$GITHUB_OUTPUT"
          echo "accent-to=$(yq '.socialPreview.accent.to' metadata.yaml)" >> "$GITHUB_OUTPUT"
          echo "accent-text=$(yq '.socialPreview.accent.text' metadata.yaml)" >> "$GITHUB_OUTPUT"
          echo "caption=$(yq '.socialPreview.caption' metadata.yaml)" >> "$GITHUB_OUTPUT"

  generate:
    needs: [enumerate, resolve-brand]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJSON(needs.enumerate.outputs.repos) }}
    uses: swift-institute/.github/.github/workflows/generate-social-preview.yml@main
    with:
      target-repo: swift-primitives/${{ matrix.repo }}
      package-name: ${{ matrix.repo }}
      namespace: ''  # resolved by reusable from target metadata.yaml or Sources/<Module>/
      accent-from: ${{ needs.resolve-brand.outputs.accent-from }}
      accent-to: ${{ needs.resolve-brand.outputs.accent-to }}
      accent-text: ${{ needs.resolve-brand.outputs.accent-text }}
      caption: ${{ needs.resolve-brand.outputs.caption }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit  # canonical per swift-ci.yml / swift-docs.yml; the called workflow's declared secrets are passed
